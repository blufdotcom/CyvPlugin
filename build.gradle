
// For those who want the bleeding edge
buildscript {
    repositories {
        jcenter()
        maven {
            name = "forge"
            url = "http://files.minecraftforge.net/maven"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

allprojects {
    repositories {
        maven { url 'https://jitpack.io' }
        mavenCentral()
    }
    tasks.withType(JavaCompile) {
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
    }
}

def cyvVersion = file("src/main/java/net/cyvplugin/CyvPlugin.java").text =~ /VERSION\s*=\s*"([^"]+)"/
version = cyvVersion.find() ? cyvVersion.group(1) : "unknown"
group = "net.cyvplugin" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "cyvplugin"

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"

    // the mappings can be changed at any time, and must be in the following format.
    // snapshot_YYYYMMDD   snapshot are built nightly.
    // stable_#            stables are built at the discretion of the MCP team.
    // Use non-default mappings at your own risk. they may not allways work.
    // simply re-run your setup task after changing the mappings to update your workspace.
    mappings = "stable_20"
    // makeObfSourceJar = false // an Srg named sources jar is made by default. uncomment this to disable.
}

processResources
{
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'

        // replace version and mcversion
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }

    // copy everything else, thats not the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

task writeSha256 {
    dependsOn 'reobfJar'
    def jarFile = file("$buildDir/libs/${archivesBaseName}-${version}.jar")
    def shaFile = file("$buildDir/${archivesBaseName}-${version}.jar.sha256")
    inputs.file jarFile
    outputs.file shaFile
    doLast {
        def digest = java.security.MessageDigest.getInstance("SHA-256")
        jarFile.withInputStream { digest.update(it.bytes) }
        shaFile.text = digest.digest().encodeHex().toString() + '\n'
    }
}
